<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17132f"><meta name="description" content="Las Bolitas de Mi Mamita YUYA"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Las Bolitas de Mi Mamita YUYA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(145deg,#0f0c29,#302b63,#24243e);color:#fff;font-family:system-ui, sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center;padding:10px}main{width:min(100%,440px);height:min(96dvh,850px);display:flex;flex-direction:column;gap:9px}h1{font-size:clamp(20px,5vw,27px);text-align:center;margin:0;font-weight:900;background:linear-gradient(90deg,#ff7777,#ffd166,#55d6ff,#f79aff);background-clip:text;color:transparent}.stats{display:flex;justify-content:space-around;background:#ffffff18;border:1px solid #ffffff25;border-radius:15px;padding:9px;font-weight:800}.stage{position:relative;flex:1;min-height:0;border:1px solid #ffffff30;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,#54458c,#17132f 75%);box-shadow:0 15px 40px #0006}canvas{width:100%;height:100%;display:block;touch-action:none}.controls{display:flex;gap:9px}.controls button{flex:1;border:0;border-radius:14px;padding:12px 8px;background:linear-gradient(135deg,#ff6b8a,#9b5de5);color:white;font-weight:800;font-size:15px}button:active{transform:scale(.97)}#message{text-align:center;min-height:20px;font-size:13px;opacity:.85}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#100c2bd9;text-align:center;padding:25px}.panel{max-width:290px}.panel h2{font-size:25px;margin:0 0 8px}.panel p{opacity:.85}.panel button{border:0;border-radius:14px;padding:13px 24px;background:#ffd166;color:#24133e;font-weight:900;font-size:16px}.hidden{display:none}
</style></head><body><main><h1>✨ Las Bolitas de Mi Mamita YUYA ✨</h1><div class="stats"><span>Puntos: <b id="score">0</b></span><span>Nivel: <b id="level">1</b></span><span>Récord: <b id="best">0</b></span></div><section class="stage"><canvas id="game"></canvas><div class="overlay" id="overlay"><div class="panel"><h2>¡Vamos a jugar!</h2><p>Apunta arrastrando el dedo y suelta para lanzar. Junta 3 o más bolitas del mismo color.</p><button id="start">JUGAR</button></div></div></section><div id="message">Arrastra para apuntar · Suelta para disparar</div><div class="controls"><button id="pause">Ⅱ Pausa</button><button id="restart">↻ Reiniciar</button></div></main>
<script>
(()=>{'use strict';const c=document.querySelector('#game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),colors=['#ff5c7a','#ffd166','#4ecdc4','#7b8cff','#c77dff','#ff9f43'];let W=0,H=0,R=17,grid=[],shot=null,aim={x:0,y:0},current=0,next=1,score=0,level=1,best=+(localStorage.yuyaBest||0),running=false,paused=false,drag=false,raf=0;
$('best').textContent=best;
function resize(){let d=c.getBoundingClientRect();let oldW=W;W=d.width;H=d.height;c.width=Math.round(W*devicePixelRatio);c.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);R=Math.max(13,Math.min(18,W/23));if(!grid.length)initGrid();draw()}new ResizeObserver(resize).observe(c);
function initGrid(){grid=[];let cols=Math.floor(W/(R*2))+1;for(let row=0;row<5;row++)for(let col=0;col<cols;col++){let x=R+col*R*2+(row%2?R:0);if(x<W-R)grid.push({x,y:R+row*R*1.78,color:Math.floor(Math.random()*colors.length)})}current=Math.floor(Math.random()*colors.length);next=Math.floor(Math.random()*colors.length)}
function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function aimAt(p){let dx=p.x-W/2,dy=p.y-(H-35);let a=Math.atan2(dy,dx);a=Math.max(-Math.PI+0.22,Math.min(-0.22,a));aim={x:W/2+Math.cos(a)*100,y:H-35+Math.sin(a)*100}}
function pointerdown(e){if(!running||paused)return;drag=true;c.setPointerCapture(e.pointerId);aimAt(pos(e));draw()}
function pointermove(e){if(drag){aimAt(pos(e));draw()}}
function pointerup(e){if(!drag)return;drag=false;aimAt(pos(e));fire()}
c.addEventListener('pointerdown',pointerdown);c.addEventListener('pointermove',pointermove);c.addEventListener('pointerup',pointerup);c.addEventListener('pointercancel',()=>drag=false);
function fire(){if(shot)return;let dx=aim.x-W/2,dy=aim.y-(H-35),len=Math.hypot(dx,dy)||1;shot={x:W/2,y:H-35,vx:dx/len*7,vy:dy/len*7,color:current};current=next;next=Math.floor(Math.random()*colors.length);tick()}
function tick(){if(!shot||paused||!running)return;shot.x+=shot.vx;shot.y+=shot.vy;if(shot.x<R||shot.x>W-R)shot.vx*=-1;let hit=shot.y<R+6||grid.some(b=>Math.hypot(b.x-shot.x,b.y-shot.y)<R*1.85);if(hit){let nearest=null,dist=1e9;for(let row=0;row<Math.ceil(H/(R*1.7));row++)for(let col=0;col<Math.ceil(W/(R*2));col++){let x=R+col*R*2+(row%2?R:0),y=R+row*R*1.78;if(x>W-R)continue;let d=Math.hypot(x-shot.x,y-shot.y);if(d<dist&&!grid.some(b=>Math.hypot(b.x-x,b.y-y)<R*1.5)){dist=d;nearest={x,y}}}if(nearest)grid.push({...nearest,color:shot.color});shot=null;resolve();draw();return}draw();raf=requestAnimationFrame(tick)}
function resolve(){let last=grid[grid.length-1],stack=[last],seen=new Set([last]);while(stack.length){let b=stack.pop();for(let n of grid)if(!seen.has(n)&&n.color===last.color&&Math.hypot(n.x-b.x,n.y-b.y)<R*2.2){seen.add(n);stack.push(n)}}if(seen.size>=3){grid=grid.filter(b=>!seen.has(b));score+=seen.size*10;$('score').textContent=score;if(score>best){best=score;localStorage.yuyaBest=best;$('best').textContent=best}if(grid.length<10){level++;$('level').textContent=level;for(let i=0;i<3+level;i++)grid.push({x:R+Math.random()*(W-2*R),y:R+Math.random()*R*7,color:Math.floor(Math.random()*colors.length)})}}if(grid.some(b=>b.y>H-R*3)){end()}}
function draw(){ctx.clearRect(0,0,W,H);for(let b of grid)bubble(b.x,b.y,b.color);if(shot)bubble(shot.x,shot.y,shot.color);else if(running){ctx.strokeStyle='#ffffff99';ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(W/2,H-35);ctx.lineTo(aim.x||W/2,H-135);ctx.stroke();ctx.setLineDash([]);bubble(W/2,H-35,current);bubble(W-30,H-28,next,8)}}
function bubble(x,y,color,rad=R){let g=ctx.createRadialGradient(x-rad*.35,y-rad*.4,2,x,y,rad);g.addColorStop(0,'#ffffff');g.addColorStop(.22,colors[color]);g.addColorStop(1,'#17132f');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff80';ctx.lineWidth=1.2;ctx.stroke()}
function start(){cancelAnimationFrame(raf);score=0;level=1;$('score').textContent=0;$('level').textContent=1;initGrid();shot=null;running=true;paused=false;$('overlay').classList.add('hidden');draw()}
function end(){running=false;$('overlay').innerHTML='<div class="panel"><h2>¡Buen intento!</h2><p>Puntuación: '+score+'</p><button id="again">VOLVER A JUGAR</button></div>';$('overlay').classList.remove('hidden');$('again').onclick=start}
$('start').onclick=start;$('restart').onclick=start;$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'▶ Seguir':'Ⅱ Pausa';if(!paused)tick()};window.addEventListener('resize',resize);resize();aim={x:W/2,y:H-130};draw();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
